# One server container serves one device. Copy .env.example to .env first.
# Compose reads .env for the ${...} values below. Shell variables override it.
#
# Resource budget: the whole stack gets about 30% of the t630 (4 cores, 6 GB RAM),
# so the host keeps room for Postgres, Redis, n8n, Qdrant and OpenWebUI.
# Stack total: 1.2 CPU, 1800 MB. LiteLLM is external and optional (ADR 0002).
services:
  server:
    build: ./server
    # All settings in .env (OTA_PIPELINE, model roles, MCP secrets) reach the server.
    # The entries below add defaults and required checks on top.
    env_file: .env
    environment:
      OTA_DEVICE_ID: ${OTA_DEVICE_ID:?set OTA_DEVICE_ID in .env}
      OTA_DEVICE_TOKEN_SHA256: ${OTA_DEVICE_TOKEN_SHA256:?set OTA_DEVICE_TOKEN_SHA256 in .env}
      OTA_LANGUAGE: ${OTA_LANGUAGE:-en}
      OTA_VOLUME: ${OTA_VOLUME:-60}
    ports:
      - "${OTA_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: ${OTA_SERVER_CPUS:-0.5}
    mem_limit: ${OTA_SERVER_MEM:-256m}
    pids_limit: 128

  # One-shot: applies the database migrations, then exits. Postgres is a host service.
  # OTA_DATABASE_URL (from the env file) must point straight at Postgres, never at a pooler.
  migrate:
    build: ./server
    command: ["ota-migrate"]
    env_file: .env
    environment:
      OTA_DEVICE_ID: ${OTA_DEVICE_ID:?set OTA_DEVICE_ID in .env}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.2
    mem_limit: 128m
    pids_limit: 64

  # Throwaway Postgres for the integration tests. Start with: --profile test.
  # The password is a test-only literal; the port is bound to localhost.
  postgres-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:${OTA_TEST_PG_PORT:-55432}:5432"
    restart: "no"
